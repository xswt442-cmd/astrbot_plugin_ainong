# 浏览器服务片段
#
# 用途：为 QQ 扫码登录提供真实浏览器会话。插件通过 Compose 内部网络访问它。
# 不映射端口到宿主机，所以不会对外暴露。
#
# 用法：把下面的服务块合并进 AstrBot 的 compose 文件，同一 network 下，
# 并把 seccomp-profile.json 与 Dockerfile.browser 放到该文件同目录。
#
# 先构建镜像（构建时本机需要能访问 npm，跑起来就不需要网络）：
#   docker build -f Dockerfile.browser -t ainong-playwright:1.63.0 .
#
# 版本对应：镜像里的 playwright 与插件依赖里的版本必须一致。浏览器由服务端
# 提供，客户端只需要 Python 包；两者版本错配时协议会不兼容。
#
# 内存说明：一个 Chromium 会话常驻约 300-500 MiB。2 核 / 2 GiB 的机器上
# 并发会话数应保持 1。下面的 mem_limit 是给单个浏览器进程设的上限，
# 超出后会被内核 OOM 杀掉，不如让它快速失败。

services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.browser
    image: ainong-playwright:1.63.0
    container_name: ainong-playwright
    restart: unless-stopped
    ipc: host
    shm_size: 512mb
    mem_limit: 900m
    security_opt:
      - seccomp=seccomp-profile.json
    # 不写任何volume：浏览器状态不落盘，会话随容器重建而消失。
    # 凭据由插件自己持久化，不依赖浏览器侧的 profile。
    networks:
      - qq_ai_net

networks:
  qq_ai_net:
    driver: bridge