[project]
name = "astrbot-plugin-ainong"
version = "0.1.16"
description = "查王者营地战绩，让模型替你锐评。"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9,<5",
    "cryptography>=42",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# 扫码登录需要连接 Playwright 服务。没有它时插件仍可正常加载，
# 只是提供不了 QQ 扫码入口。
qq-verify = ["playwright>=1.51,<2"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
# 项目包放在仓库根的 ainong/ 而不是 src/ 布局，装成 editable 时能找到；
# 这一行让不安装本项目的环境（直接跑 pytest）也能 import。
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ainong"]