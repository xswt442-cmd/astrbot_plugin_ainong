name: checks

on:
  # 门禁要跑在改动还能被处理的地方。只有 push 和定时任务时，第一个信号
  # 是合并提交把 main 弄红，而合并请求可能从未被测过。
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main, dev]

# 每个分支一次运行：一串提交会互相取消，而不是把完整的检查排在彼此后面。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 准备 Python
        run: uv python install

      - name: 安装依赖
        run: uv sync --locked

      - name: lint
        run: uv run ruff check .

      - name: 格式检查
        run: uv run ruff format --check .

      - name: 测试
        run: uv run pytest -q

  dependencies:
    name: 依赖清单同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 准备 Python
        run: uv python install

      - name: 同步依赖
        run: uv sync --locked

      # requirements.txt 是交给 AstrBot 装进容器的依赖清单，由 uv export
      # 生成。改了 pyproject.toml 却忘了重新导出，装插件时就会缺包，而本地
      # uv 环境里一切正常，所以这里单独设一道门。
      #
      # uv 写进文件头的注释带着 --output-file 的路径，那条路径每台机器不同，
      # 所以先剥掉前两行注释再比对。
      - name: 检查 requirements.txt 是否与 pyproject.toml 一致
        run: |
          uv export --format requirements.txt --no-hashes --no-dev \
            --no-emit-project --frozen --output-file /tmp/expected.txt
          tail -n +3 /tmp/expected.txt > /tmp/expected-clean.txt
          tail -n +3 requirements.txt > /tmp/actual-clean.txt
          if ! diff -u /tmp/actual-clean.txt /tmp/expected-clean.txt; then
            echo "::error::requirements.txt 与 pyproject.toml 不一致。"
            echo "重新生成：uv export --format requirements.txt --no-hashes --no-dev"
            echo "  --no-emit-project --frozen --output-file requirements.txt"
            exit 1
          fi

  signature:
    name: YSDK 签名真实验证
    runs-on: ubuntu-latest
    # 这道检查打真实的腾讯接口，会发三次请求确认服务端确实在验签。
    # 一天跑一次足够发现签名被改坏，不需要每次提交都跑。
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 准备 Python
        run: uv python install

      - name: 同步依赖
        run: uv sync --locked

      - name: 验证签名被服务端接受
        run: uv run python test/verify_ysdk_signature.py

  deploy:
    name: 浏览器服务配置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 uv
        uses: astral-sh/setup-uv@v6

      - name: 准备 Python
        run: uv python install

      - name: 同步依赖
        run: uv sync --locked

      # 浏览器容器起不来时 seccomp 配置是最常见的原因，而它只在部署时才暴露。
      # 这里真的把 compose 渲染一遍并检查配置合法，成本很低。
      - name: compose 片段可渲染
        run: |
          docker compose -f deploy/compose.playwright.yaml config --quiet
          echo "compose 配置合法"

      - name: seccomp 配置是合法 JSON
        run: |
          uv run python -c "
          import json, sys
          d = json.load(open('deploy/seccomp-profile.json', encoding='utf-8'))
          assert d['defaultAction'] == 'SCMP_ACT_ERRNO', '默认动作应拒绝未列入的调用'
          assert d['syscalls'], 'syscall 列表不能为空'
          print(f\"seccomp 配置合法，{len(d['syscalls'][0]['names'])} 个允许项\")
          "